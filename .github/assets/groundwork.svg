<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="title">
  <title id="title">Utopia stands on USWDS, which stands on WCAG, which stands on the Web Platform.</title>
  <style>
    .layer { stroke: none; }
    .utopia { fill: #e6ecf7; }
    .uswds { fill: #cfdbf0; }
    .wcag { fill: #b4c7e8; }
    .browsers { fill: #97b1de; }
    text {
      fill: #172338;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-anchor: middle;
      dominant-baseline: central;
    }
    @media (prefers-color-scheme: dark) {
      .utopia { fill: #3a4d6e; }
      .uswds { fill: #30415e; }
      .wcag { fill: #27364f; }
      .browsers { fill: #1f2b40; }
      text { fill: #e6ecf7; }
    }
  </style>
  <polygon class="layer utopia" points="320,20 387.4,97 252.6,97" />
  <polygon class="layer uswds" points="247.4,103 392.6,103 457.4,177 182.6,177" />
  <polygon class="layer wcag" points="177.4,183 462.6,183 527.4,257 112.6,257" />
  <polygon class="layer browsers" points="107.4,263 532.6,263 600,340 40,340" />
  <text x="320" y="74">Utopia</text>
  <text x="320" y="140">USWDS</text>
  <text x="320" y="220">WCAG</text>
  <text x="320" y="301.5">Web Platform</text>
</svg>
