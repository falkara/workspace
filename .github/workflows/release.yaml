name: Release
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push waits instead of interrupting a release under way.
  cancel-in-progress: false
permissions: {}
jobs:
  Release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Packages are published through npm trusted publishing and JSR's GitHub link, with no token in the repository.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '^26.13.0'
          # The cache lookup runs the preinstalled npm in the repository, which its devEngines refuse.
          package-manager-cache: false
      - name: Set up npm
        # Run outside the repository, as its devEngines refuse the preinstalled npm.
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12
      - name: Install the dependencies
        run: npm ci
      - name: Open the Version Packages pull request or publish the packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action runs the script without a shell, so the shell joins the versioning and the lockfile update.
          version-script: sh -c "npx changeset version && npm install --package-lock-only"
          publish-script: npx changeset publish
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the presentation library to JSR
        # Every run without changesets, whose package.json holds the version npm has; JSR never publishes a version it already has, so a version an earlier run left out is published by the next. A run with changesets holds the next version in a Version Packages pull request instead.
        if: steps.changesets.outputs.has-changesets == 'false'
        working-directory: libraries/presentation
        run: |
          npx vp pack
          npx jsr@0.14.3 publish --set-version "$(node --print "require('./package.json').version")"
