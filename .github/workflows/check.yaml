name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes the checks of an older one moot.
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  Check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '^26.13.0'
          # The cache lookup runs the preinstalled npm in the repository, which its devEngines refuse.
          package-manager-cache: false
      - name: Set up npm
        # Run outside the repository, as its devEngines refuse the preinstalled npm.
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12
      - name: Install the dependencies
        run: npm ci
      - name: Format, lint and type check
        run: npx vp check
      - name: Test
        run: npx vp test
