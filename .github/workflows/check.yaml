name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes the checks of an older one moot.
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  Check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '^26.13.0'
          # The cache lookup runs the preinstalled npm in the repository, which its devEngines refuse.
          package-manager-cache: false
      - name: Set up npm
        # Run outside the repository, as its devEngines refuse the preinstalled npm.
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12
      - name: Install the dependencies
        run: npm ci
      - name: Format, lint and type check
        run: npx vp check
      - name: Test
        run: npx vp test
  Theory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test the theory
        # Installs Lean at the version that lean-toolchain pins, builds every library of the theory, which checks every proof, and builds its checks with lake test.
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          lake-package-directory: theory
          build-args: Citation ExportTypeScript Generator Presentation References
      - name: Generate the TypeScript of the theory
        # Fails where a module of the library leaves out a redeclaration of the theory or gives it another comment.
        working-directory: theory
        run: lake exe generator Presentation ../libraries/presentation/src
      - name: Check that the generated files match the theory
        # A file that the generator changes or writes anew means the theory changed without its files.
        run: |
          git status --porcelain -- libraries/presentation/src
          git diff --exit-code -- libraries/presentation/src
          test -z "$(git status --porcelain -- libraries/presentation/src)"
