name: Check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push makes the checks of an older one moot.
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  Check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '^26.13.0'
          # The cache lookup runs the preinstalled npm in the repository, which its devEngines refuse.
          package-manager-cache: false
      - name: Set up npm
        # Run outside the repository, as its devEngines refuse the preinstalled npm.
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12
      - name: Install the dependencies
        run: npm ci
      - name: Format, lint and type check
        run: npm run check
      - name: Test
        run: npx vp test
      - name: Set up Deno
        # Deno checks a library as JSR publishes it, which the jsr package on npm only wraps.
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.8'
      - name: Check the presentation library as JSR publishes it
        # Packs the library and checks what JSR would publish: every export names a module, every module names its types, and the types check.
        working-directory: libraries/presentation
        run: |
          npx vp pack
          deno publish --dry-run --set-version "$(node --print "require('./package.json').version")"
      - name: Check the simulation library as JSR publishes it
        # Packs the library and checks what JSR would publish: every export names a module, every module names its types, and the types check.
        working-directory: libraries/simulation
        run: |
          npx vp pack
          deno publish --dry-run --set-version "$(node --print "require('./package.json').version")"
