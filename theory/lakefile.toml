name = "falkara"
license = "MIT AND CC-BY-SA-4.0"
reservoir = false
defaultTargets = ["Falkara"]
testDriver = "FalkaraTest"
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
maxSynthPendingDepth = 3
linter.missingDocs = true
pp.unicode.fun = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "Released under MIT license as described in the file LICENSE."

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "Falkara"

[[lean_lib]]
name = "FalkaraTest"
globs = ["FalkaraTest.+"]

[[lean_lib]]
name = "Generator"

[[lean_lib]]
name = "GeneratorTest"
globs = ["GeneratorTest.+"]

[[lean_exe]]
name = "generator"
root = "Generator.Main"
